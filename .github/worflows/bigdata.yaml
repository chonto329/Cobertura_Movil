name: Cobertura Movil

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: "0 4 * * *"  # Ejecución automática diaria (04:00 UTC)
  workflow_dispatch:     # Permite ejecución manual desde GitHub

jobs:
  ejecutar-etl-y-verificar:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3. Instalar Dependencias Requeridas
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pandas openpyxl; fi

      - name: 4. Ejecutar Script de Ingesta ETL
        run: python ingestion.py

      - name: 5. Verificar Creación de BDD y Archivos de Evidencia
        run: |
          echo "=== VERIFICANDO EXISTENCIA DE ARTEFACTOS ==="
          
          # Validación de Base de Datos SQLite
          if [ -f "data/db_cobertura_movil.db" ]; then
            echo "[OK] Base de datos 'data/db_cobertura_movil.db' creada exitosamente."
          else
            echo "[ERROR] No se encontró la base de datos SQLite." && exit 1
          fi

          # Validación del Archivo de Muestra (Excel/CSV)
          if [ -f "src/static/auditoria/ingestion.xlsx" ] || [ -f "output/muestra_representativa_cobertura.csv" ]; then
            echo "[OK] Archivo de muestra generado correctamente en carpeta 'output/'."
          else
            echo "[ERROR] No se encontró el archivo de muestra." && exit 1
          fi

          # Validación del Archivo de Auditoría (.txt)
          if [ -f "output/auditoria_ingesta.txt" ]; then
            echo "[OK] Archivo de auditoría 'output/auditoria_ingesta.txt' generado correctamente."
          else
            echo "[ERROR] No se encontró el archivo de auditoría." && exit 1
          fi

      - name: 6. Publicar Artefactos Generados (Evidencias y BDD)
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-etl-cobertura
          path: |
            output/
            data/db_cobertura_movil.db
          retention-days: 14